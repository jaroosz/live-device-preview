name: ios-build
on:
  push:
    paths:
      - 'ios/**'
      - 'protocol/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          xcodebuild -project LiveDevicePreview.xcodeproj -scheme LiveDevicePreview \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LiveDevicePreview.app Payload/
          zip -r LiveDevicePreview.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: LiveDevicePreview
          path: ios/LiveDevicePreview.ipa